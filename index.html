<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREEN STORE - WORKING</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<style>
body{background:#060d07;color:#fff;font-family:sans-serif;margin:0;padding:0}
header{background:#0c1f0f;padding:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #1a3d1f;position:sticky;top:0;z-index:10}
.btn{border:none;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}.btn-gold{background:#C6A86F;color:#000}.btn-dark{background:#0c1f0f;color:#fff;border:1px solid #1a3d1f}
.products{padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding-bottom:80px}
.card{background:#0c1f0f;border:1px solid #1a3d1f;border-radius:16px;overflow:hidden}
.card-img{height:130px;background:#0a1a0c;display:flex;align-items:center;justify-content:center}.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:8px}.price{color:#C6A86F;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.modal-box{background:#0c1f0f;border:1px solid #1a3d1f;border-radius:16px;padding:14px;width:100%;max-width:500px}
input,select,textarea{width:100%;padding:10px;background:#0a1a0c;border:1px solid #1a3d1f;border-radius:10px;color:#fff;margin:4px 0}
.cart-item{border:1px solid #1a3d1f;border-radius:10px;padding:8px;margin:5px 0;background:#0a1a0c;display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<header>
<b style="color:#C6A86F">GS GREEN STORE</b>
<input id="searchBar" placeholder="Search..." style="flex:1;padding:8px;border-radius:999px;border:1px solid #1a3d1f;background:#0a1a0c;color:#fff" oninput="doSearch(this.value)">
<button class="btn btn-dark" onclick="document.getElementById('walletModal').style.display='flex'">Wallet <span id="walletBal">#500</span></button>
<button class="btn btn-gold" onclick="openCart()"><i class="ri-shopping-cart-line"></i> <span id="cartCount">0</span></button>
<button class="btn btn-dark" id="authBtn" onclick="document.getElementById('authModal').style.display='flex'">Login</button>
</header>

<div id="productGrid" class="products"><p style="grid-column:1/-1;text-align:center;padding:30px">Loading Africa store... If not loading, check internet</p></div>

<!-- CART - WILL OPEN -->
<div id="cartModal" class="modal"><div class="modal-box">
<h3>Cart - Selected Items</h3>
<div id="cartItems" style="max-height:35vh;overflow:auto"></div>
<div style="margin-top:10px;border:2px solid #C6A86F;border-radius:10px;padding:10px;display:flex;justify-content:space-between">
<div>TOTAL <b id="cartTotal" style="color:#C6A86F">#0</b></div>
<div>Items <b id="cartTotalItems">0</b> | Wallet <b id="cartWallet">#500</b></div>
</div>
<button class="btn btn-gold" style="width:100%;margin-top:10px;padding:12px" onclick="openCheckout()">ORDER NOW - FILL FORM & PAY WALLET</button>
<button class="btn btn-dark" style="width:100%;margin-top:6px" onclick="closeAll()">Continue Shopping</button>
</div></div>

<!-- CHECKOUT FORM -->
<div id="checkoutModal" class="modal"><div class="modal-box">
<h3>Order Form - Wallet Only</h3>
<p>Total: <b id="checkoutTotal" style="color:#C6A86F">#0</b></p>
<input id="cFullName" placeholder="Full Name *">
<input id="cPhone" placeholder="Phone *">
<input id="cEmail" placeholder="Email *">
<input id="deliveryAddr" placeholder="Street Address *">
<div style="display:flex;gap:6px"><input id="cCity" placeholder="City *" style="flex:1"><input id="cState" placeholder="State *" style="flex:1"></div>
<select id="cCountry"><option value="">Country *</option><option>Nigeria</option><option>Ghana</option><option>Kenya</option><option>South Africa</option><option>Other Africa</option></select>
<textarea id="cNote" placeholder="Note"></textarea>
<button class="btn btn-gold" style="width:100%;padding:12px;margin-top:8px" onclick="placeOrder()">CONFIRM & PAY - WALLET ONLY</button>
<button class="btn btn-dark" style="width:100%;margin-top:6px" onclick="backToCart()">Back to Cart</button>
</div></div>

<div id="authModal" class="modal"><div class="modal-box"><h3>Login</h3><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn btn-gold" style="width:100%;margin-top:6px" onclick="login()">Login</button><button class="btn btn-dark" style="width:100%;margin-top:6px" onclick="signup()">Signup + #500</button><div id="authMsg" style="font-size:11px;color:#C6A86F"></div><button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="closeAll()">Close</button></div></div>
<div id="walletModal" class="modal"><div class="modal-box"><h3>Wallet <span id="walletBal2">#500</span></h3><p style="font-size:12px">PalmPay: <b style="color:#C6A86F">9122857147</b> - Barnabas Paul</p><input id="fundAmount" type="number" placeholder="Amount"><input id="fundRef" placeholder="Ref"><button class="btn btn-gold" style="width:100%" onclick="submitFunding()">I HAVE PAID</button><div id="fundsList" style="font-size:11px;margin-top:8px"></div><button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="closeAll()">Close</button></div></div>
<div id="adminModal" class="modal"><div class="modal-box"><h3>Admin - Add Product</h3><input id="pname" placeholder="Name"><input id="pprice" type="number" placeholder="Price"><input id="pcat" placeholder="Category e.g Kitchen screen"><input id="pimage" placeholder="Image URL"><button class="btn btn-gold" style="width:100%;margin-top:6px" onclick="addProduct()">ADD</button><div id="adminFunds" style="max-height:20vh;overflow:auto;margin-top:8px"></div><button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="closeAll()">Close</button></div></div>

<script>
const supabase=window.supabase.createClient('https://lmlivfvwhjkfxiukdrlm.supabase.co','sb_publishable_8Lhp0kpFsJM6Wrq_ZxKwgQ_YDrxBUaE');
let cart=[],products=[],user=null,wallet=500;const ADMIN_EMAIL="barnabaspaul43@gmail.com";

function openCart(){updateCart();document.getElementById('cartModal').style.display='flex';}
function openCheckout(){if(cart.length==0)return alert('Cart empty');closeAll();setTimeout(()=>{document.getElementById('checkoutModal').style.display='flex';},100);}
function backToCart(){closeAll();setTimeout(()=>{openCart();},100);}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none');}
function updateCart(){
 const total=cart.reduce((s,i)=>s+(i.price*i.qty),0);
 const count=cart.reduce((s,i)=>s+i.qty,0);
 document.getElementById('cartCount').innerText=count;
 document.getElementById('cartTotal').innerText='#'+total.toLocaleString();
 document.getElementById('checkoutTotal').innerText='#'+total.toLocaleString();
 document.getElementById('cartTotalItems').innerText=count;
 document.getElementById('cartWallet').innerText='#'+wallet;
 document.getElementById('walletBal').innerText='#'+wallet;
 document.getElementById('walletBal2').innerText='#'+wallet;
 const box=document.getElementById('cartItems');
 if(cart.length==0){box.innerHTML='<p style="text-align:center;color:#6a8a70;padding:20px">Cart empty</p>';return;}
 box.innerHTML=cart.map((c,i)=>`<div class="cart-item"><div style="flex:1"><b>${c.name}</b><br><span style="color:#C6A86F">#${c.price} x ${c.qty} = #${c.price*c.qty}</span></div><div style="display:flex;gap:4px;align-items:center"><button class="btn btn-dark" style="padding:4px 8px" onclick="editQty(${i},-1)">-</button><b>${c.qty}</b><button class="btn btn-dark" style="padding:4px 8px" onclick="editQty(${i},1)">+</button><button class="btn" style="background:#ff4444;color:#fff;padding:4px 8px" onclick="delItem(${i})">X</button></div></div>`).join('');
}
function editQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCart();}
function delItem(i){cart.splice(i,1);updateCart();}
function addCart(n,p){const e=cart.findIndex(c=>c.name===n);if(e>-1){cart[e].qty++;}else{cart.push({name:n,price:+p,qty:1});}updateCart();openCart();}
async function loadProducts(){const {data,error}=await supabase.from('products').select('*').order('created_at',{ascending:false}).limit(100);if(error){document.getElementById('productGrid').innerHTML='<p>Error: '+error.message+'</p>';return;}products=data||[];document.getElementById('productGrid').innerHTML=products.map(p=>`<div class="card"><div class="card-img">${p.image?`<img src="${p.image}">`:'No img'}</div><div class="card-body"><b style="font-size:12px">${p.name}</b><div class="price">#${Number(p.price).toLocaleString()}</div><button class="btn btn-gold" style="width:100%;margin-top:6px" onclick="addCart('${p.name.replace(/'/g,"")}','${p.price}')">Add to Cart</button></div></div>`).join('')||'<p>No products - Login as admin to add</p>';}
function doSearch(v){document.getElementById('productGrid').innerHTML=products.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())).map(p=>`<div class="card"><div class="card-img">${p.image?`<img src="${p.image}">`:'No'}</div><div class="card-body"><b>${p.name}</b><div class="price">#${p.price}</div><button class="btn btn-gold" style="width:100%;margin-top:6px" onclick="addCart('${p.name.replace(/'/g,"")}','${p.price}')">Add</button></div></div>`).join('');}
async function signup(){const {data,error}=await supabase.auth.signUp({email:email.value,password:password.value});if(error){authMsg.innerText=error.message;return;}authMsg.innerText='Created! #500';await supabase.from('wallets').insert({user_id:data.user.id,balance:500});wallet=500;updateCart();}
async function login(){const {data,error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error){authMsg.innerText=error.message;return;}user=data.user;authBtn.innerText=user.email.slice(0,8);closeAll();const {data:w}=await supabase.from('wallets').select('balance').eq('user_id',user.id).single();if(w){wallet=w.balance;updateCart();}if(user.email===ADMIN_EMAIL){if(confirm('Admin? Add product?')){document.getElementById('adminModal').style.display='flex';loadAdminFunds();}}}
async function submitFunding(){if(!user)return alert('Login');const {error}=await supabase.from('fundings').insert({user_id:user.id,amount:+fundAmount.value,monnify_ref:fundRef.value,status:'pending'});if(error)alert(error.message);else{alert('Submitted');closeAll();}}
async function addProduct(){if(!user||user.email!==ADMIN_EMAIL)return alert('Only admin');const {error}=await supabase.from('products').insert({name:pname.value,price:+pprice.value,category:pcat.value||'General',image:pimage.value});if(error)alert(error.message);else{alert('Added');loadProducts();closeAll();}}
async function loadAdminFunds(){const {data}=await supabase.from('fundings').select('*').eq('status','pending');document.getElementById('adminFunds').innerHTML=(data||[]).map(f=>`<div style="border:1px solid #1a3d1f;padding:6px;margin:4px 0">User ${f.user_id.slice(0,6)} #${f.amount} <button class="btn btn-gold" onclick="approveFunding('${f.id}','${f.user_id}',${f.amount})">APPROVE</button></div>`).join('')||'No pending';}
async function approveFunding(id,uid,amt){const {data:w}=await supabase.from('wallets').select('balance').eq('user_id',uid).single();const newBal=(w?.balance||0)+amt;await supabase.from('wallets').update({balance:newBal}).eq('user_id',uid);await supabase.from('fundings').update({status:'approved'}).eq('id',id);alert('Approved');loadAdminFunds();}
async function placeOrder(){
 const total=cart.reduce((s,i)=>s+(i.price*i.qty),0);
 if(!user)return alert('Login first');if(cart.length==0)return alert('Empty');
 if(!cFullName.value||!cPhone.value||!cEmail.value||!deliveryAddr.value||!cCity.value||!cState.value||!cCountry.value)return alert('Fill all *');
 if(total>wallet)return alert('Low wallet #'+wallet);
 const waybill='GS-AFRICA-'+Math.floor(100000+Math.random()*900000);
 const addr=`${cFullName.value} | ${cPhone.value} | ${cEmail.value} | ${deliveryAddr.value}, ${cCity.value}, ${cState.value}, ${cCountry.value}`;
 const {error}=await supabase.from('orders').insert({user_id:user.id,products:cart,total,status:'Wallet Paid',waybill_number:waybill,delivery_address:addr});
 if(error)alert(error.message);else{wallet-=total;await supabase.from('wallets').update({balance:wallet}).eq('user_id',user.id);updateCart();cart=[];updateCart();alert('PAID! Waybill '+waybill+' New Bal #'+wallet);closeAll();}
}
loadProducts();
supabase.auth.getUser().then(({data})=>{if(data.user){user=data.user;authBtn.innerText=data.user.email.slice(0,8);supabase.from('wallets').select('balance').eq('user_id',user.id).single().then(({data})=>{if(data){wallet=data.balance;updateCart();}});}});
document.querySelectorAll('.modal').forEach(m=>{m.addEventListener('click',e=>{if(e.target===m)closeAll();})});
</script>
</body>
</html>
